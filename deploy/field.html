<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GI Field</title>
<link rel="manifest" href="manifest-field.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --text: #e4e4e7; --muted: #71717a; --accent: #3b82f6; --green: #22c55e; --yellow: #eab308; --red: #ef4444; }
body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
.header { padding: 1rem; background: var(--surface); border-bottom: 1px solid var(--border); text-align: center; font-weight: 600; }
.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; }
.tab-bar button { flex: 1; padding: 0.8rem; background: none; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; }
.tab-bar button.active { color: var(--accent); }
.content { padding: 1rem; }
.case-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem; }
.case-card .title { font-weight: 600; margin-bottom: 0.3rem; }
.case-card .meta { color: var(--muted); font-size: 0.8rem; }
.badge { padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.65rem; font-weight: 600; background: #22c55e22; color: var(--green); }
.badge-assigned { background: #3b82f622; color: var(--accent); }
.badge-in_progress { background: #eab30822; color: var(--yellow); }
.badge-served { background: #22c55e22; color: var(--green); }
.badge-failed { background: #ef444422; color: var(--red); }
.action-sheet { position: fixed; bottom: 80px; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 1.5rem; transform: translateY(100%); transition: transform 0.2s; border-radius: 16px 16px 0 0; z-index: 50; }
.action-sheet.open { transform: translateY(0); }
.action-sheet textarea, .action-sheet input, .action-sheet select { width: 100%; padding: 0.7rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; margin-bottom: 0.5rem; }
.action-sheet textarea { min-height: 80px; resize: none; }
.btn { background: var(--accent); color: #fff; border: none; padding: 0.7rem 1.2rem; border-radius: 8px; font-size: 0.9rem; width: 100%; margin-top: 0.5rem; cursor: pointer; }
.btn-green { background: var(--green); }
.btn-cancel { background: var(--border); }
.auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 1rem; }
.auth-screen input { padding: 0.8rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 1.5rem; text-align: center; width: 150px; letter-spacing: 0.3em; }
.serve-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 0.8rem; }
.serve-card .title { font-weight: 600; margin-bottom: 0.3rem; }
.serve-card .meta { color: var(--muted); font-size: 0.8rem; }
.attempt-item { padding: 0.5rem; border-left: 2px solid var(--border); margin: 0.5rem 0; padding-left: 0.8rem; }
.attempt-item .result { font-weight: 600; font-size: 0.8rem; }
</style>
</head>
<body>
<div id="auth" class="auth-screen" style="display:none">
  <h2>GI Field</h2>
  <input type="password" id="pin-input" maxlength="6" placeholder="PIN">
  <button class="btn" style="width:150px" onclick="doLogin()">Enter</button>
</div>

<div id="app" style="display:none">
  <div class="header">GI Field</div>
  <div class="content" id="content"></div>
  <div class="tab-bar">
    <button class="active" onclick="showTab('cases')">My Cases</button>
    <button onclick="showTab('serves')">Serves</button>
    <button onclick="showTab('camera')">Camera</button>
  </div>
</div>

<!-- Note sheet -->
<div class="action-sheet" id="note-sheet">
  <h3 style="margin-bottom:0.8rem">Quick Note</h3>
  <textarea id="note-text" placeholder="What happened..."></textarea>
  <button class="btn" onclick="submitNote()">Save Note</button>
  <button class="btn btn-cancel" onclick="closeSheet('note-sheet')">Cancel</button>
</div>

<!-- Attempt sheet -->
<div class="action-sheet" id="attempt-sheet">
  <h3 style="margin-bottom:0.8rem">Log Attempt</h3>
  <select id="attempt-result">
    <option value="not_home">Not Home</option>
    <option value="served">Served</option>
    <option value="refused">Refused</option>
    <option value="other">Other</option>
  </select>
  <textarea id="attempt-notes" placeholder="Notes..."></textarea>
  <button class="btn btn-green" onclick="submitAttempt()">Log Attempt</button>
  <button class="btn btn-cancel" onclick="closeSheet('attempt-sheet')">Cancel</button>
</div>

<script src="config.js"></script>
<script>
let cases = [];
let serves = [];
let selectedCase = null;
let selectedServe = null;
let currentTab = 'cases';

if (!localStorage.getItem('gi_pin')) {
  document.getElementById('auth').style.display = 'flex';
} else { boot(); }

function doLogin() {
  const pin = document.getElementById('pin-input').value;
  if (pin) { localStorage.setItem('gi_pin', pin); document.getElementById('auth').style.display = 'none'; boot(); }
}

async function boot() {
  document.getElementById('app').style.display = 'block';
  cases = await api('/api/cases?assigned_to=daniel') || [];
  serves = await api('/api/serves?assigned_to=daniel') || [];
  render();
}

function showTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab-bar button').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && t === 'cases') || (i === 1 && t === 'serves') || (i === 2 && t === 'camera'));
  });
  if (t === 'camera') { openCamera(); return; }
  render();
}

function render() {
  const el = document.getElementById('content');
  if (currentTab === 'serves') { el.innerHTML = renderServes(); return; }
  el.innerHTML = renderCases();
}

function renderCases() {
  if (cases.length === 0) return '<p style="color:var(--muted);text-align:center;margin-top:3rem">No assigned cases</p>';
  return cases.map(c => `
    <div class="case-card" onclick="selectCase('${c.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="title">${c.title}</div>
        <span class="badge">${c.status}</span>
      </div>
      <div class="meta">${c.type.replace(/_/g,' ')} · ${c.priority}</div>
    </div>
  `).join('');
}

function renderServes() {
  if (serves.length === 0) return '<p style="color:var(--muted);text-align:center;margin-top:3rem">No assigned serves</p>';
  return serves.map(s => `
    <div class="serve-card" onclick="openServe('${s.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="title">${s.subject.name || 'Unknown Subject'}</div>
        <span class="badge badge-${s.status}">${s.status.replace(/_/g,' ')}</span>
      </div>
      <div class="meta">${s.subject.address || 'No address'} · ${s.attempts.length} attempts</div>
    </div>
  `).join('');
}

function selectCase(id) {
  selectedCase = id;
  document.getElementById('note-sheet').classList.add('open');
}

function openServe(id) {
  selectedServe = id;
  document.getElementById('attempt-sheet').classList.add('open');
}

function closeSheet(sheetId) {
  document.getElementById(sheetId).classList.remove('open');
}

async function submitNote() {
  const text = document.getElementById('note-text').value;
  if (!text || !selectedCase) return;
  let loc = '';
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout: 5000}));
      loc = ` [GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}]`;
    } catch(e) {}
  }
  await api(`/api/cases/${selectedCase}/notes`, { method: 'POST', body: { text: text + loc, author: 'daniel' } });
  document.getElementById('note-text').value = '';
  closeSheet('note-sheet');
  cases = await api('/api/cases?assigned_to=daniel') || [];
  render();
}

async function submitAttempt() {
  if (!selectedServe) return;
  const result = document.getElementById('attempt-result').value;
  const notes = document.getElementById('attempt-notes').value;
  let gps = null;
  if (navigator.geolocation) {
    try {
      const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout: 5000}));
      gps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    } catch(e) {}
  }
  await api(`/api/serves/${selectedServe}/attempts`, { method: 'POST', body: { result, notes, gps, photo_evidence_id: '' } });
  document.getElementById('attempt-notes').value = '';
  closeSheet('attempt-sheet');
  serves = await api('/api/serves?assigned_to=daniel') || [];
  render();
}

function openCamera() {
  const el = document.getElementById('content');
  el.innerHTML = `
    <div style="text-align:center;margin-top:2rem">
      <p style="color:var(--muted);margin-bottom:1rem">Capture evidence photo</p>
      <select id="camera-case" style="width:100%;padding:0.7rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);margin-bottom:1rem">
        <option value="">Select case...</option>
        ${cases.map(c => `<option value="${c.id}">${c.title}</option>`).join('')}
      </select>
      <input type="text" id="camera-desc" placeholder="Description..." style="width:100%;padding:0.7rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);margin-bottom:1rem">
      <button class="btn btn-green" onclick="capturePhoto()">Take Photo</button>
    </div>
  `;
}

function capturePhoto() {
  const caseId = document.getElementById('camera-case').value;
  if (!caseId) { alert('Select a case first'); return; }
  const desc = document.getElementById('camera-desc').value;

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    let gps = null;
    if (navigator.geolocation) {
      try {
        const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout: 5000}));
        gps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      } catch(e) {}
    }
    await api(`/api/cases/${caseId}/evidence`, {
      method: 'POST',
      body: {
        type: 'photo',
        filename: file.name,
        description: desc,
        captured_by: 'daniel',
        captured_at: new Date().toISOString(),
        gps: gps
      }
    });
    alert('Evidence logged: ' + file.name);
    document.getElementById('camera-desc').value = '';
  };
  input.click();
}
</script>
</body>
</html>
